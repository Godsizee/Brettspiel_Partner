<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Everdell Duo – alternatives Cover">
  <defs>
    <!-- Tag/Nacht-Verlauf: links Sonne (Tag), rechts Mond (Nacht) -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#7ec8e3"/>
      <stop offset="0.32" stop-color="#8fd3b6"/>
      <stop offset="0.6" stop-color="#2f6d78"/>
      <stop offset="1" stop-color="#122b4a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#f6c453" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6c453" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dfe9ff" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#9db8e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9db8e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8f5e"/>
      <stop offset="1" stop-color="#1f5738"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c7048"/>
      <stop offset="1" stop-color="#123a25"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4a2e"/>
      <stop offset="0.5" stop-color="#8a6238"/>
      <stop offset="1" stop-color="#4f3520"/>
    </linearGradient>
    <radialGradient id="canopy" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#66b877"/>
      <stop offset="0.6" stop-color="#3d8a53"/>
      <stop offset="1" stop-color="#215c34"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Himmel -->
  <rect width="600" height="600" fill="url(#sky)"/>

  <!-- Sonne (links) und Mond (rechts) – die Duo-Mechanik -->
  <circle cx="118" cy="128" r="120" fill="url(#sunGlow)"/>
  <circle cx="118" cy="128" r="46" fill="#ffdd8a"/>
  <circle cx="472" cy="120" r="120" fill="url(#moonGlow)"/>
  <path d="M486 78 a44 44 0 1 0 0 88 a34 34 0 1 1 0 -88 z" fill="#eef3ff"/>

  <!-- Sterne / Glühwürmchen -->
  <g fill="#fff3c4">
    <circle cx="405" cy="70" r="2.4" opacity="0.9"/>
    <circle cx="520" cy="180" r="2" opacity="0.8"/>
    <circle cx="360" cy="150" r="1.6" opacity="0.7"/>
    <circle cx="558" cy="90" r="1.8" opacity="0.8"/>
    <circle cx="300" cy="95" r="1.5" opacity="0.6"/>
  </g>
  <g fill="#ffe27a">
    <circle cx="250" cy="330" r="3" opacity="0.9"/>
    <circle cx="330" cy="380" r="2.4" opacity="0.85"/>
    <circle cx="200" cy="300" r="2.2" opacity="0.8"/>
    <circle cx="410" cy="345" r="2.6" opacity="0.85"/>
    <circle cx="150" cy="360" r="2" opacity="0.7"/>
    <circle cx="470" cy="400" r="2.4" opacity="0.8"/>
    <circle cx="360" cy="300" r="1.8" opacity="0.7"/>
  </g>

  <!-- ferne Hügel -->
  <path d="M0 430 Q150 360 320 420 T600 405 L600 600 L0 600 Z" fill="url(#hill)"/>

  <!-- Der große Everdell-Baum -->
  <g>
    <!-- Krone -->
    <ellipse cx="300" cy="250" rx="185" ry="150" fill="url(#canopy)"/>
    <ellipse cx="205" cy="285" rx="95" ry="80" fill="#347d49" opacity="0.9"/>
    <ellipse cx="395" cy="285" rx="95" ry="80" fill="#347d49" opacity="0.9"/>
    <ellipse cx="300" cy="205" rx="110" ry="85" fill="#5aa96b" opacity="0.85"/>
    <!-- Stamm -->
    <path d="M270 330 Q262 400 250 470 L350 470 Q338 400 330 330 Z" fill="url(#trunk)"/>
    <!-- kleine Baumhaus-Fenster (Everdell-Motiv) -->
    <circle cx="286" cy="392" r="12" fill="#ffcf6b"/>
    <circle cx="286" cy="392" r="12" fill="none" stroke="#5a3a1e" stroke-width="3"/>
    <rect x="304" y="410" width="20" height="30" rx="9" fill="#ffcf6b" stroke="#5a3a1e" stroke-width="3"/>
    <circle cx="266" cy="430" r="8" fill="#ffcf6b" stroke="#5a3a1e" stroke-width="2.5"/>
  </g>

  <!-- vordere Wiese -->
  <path d="M0 470 Q160 415 320 470 T600 460 L600 600 L0 600 Z" fill="url(#hillFront)"/>

  <!-- Hase (links) – Silhouette -->
  <g fill="#173a26" opacity="0.96">
    <path d="M150 470
             q-4 -40 6 -78
             q-14 -30 -8 -60 q10 6 14 30
             q6 -30 22 -30 q10 24 2 52
             q16 30 10 74
             q10 26 -6 42
             q-24 12 -46 -6
             q-8 -12 0 -20 z"/>
    <circle cx="150" cy="330" r="5" fill="#0d2317"/>
  </g>

  <!-- Schildkröte mit Zylinder (rechts) – Silhouette -->
  <g fill="#123024" opacity="0.96">
    <!-- Panzer -->
    <path d="M400 470 q-6 -46 50 -46 q56 0 50 46 z"/>
    <!-- Kopf -->
    <path d="M452 430 q28 -6 30 -30 q0 -18 -18 -20 q-20 0 -22 22 q0 18 10 28 z"/>
    <!-- Zylinder -->
    <rect x="452" y="360" width="34" height="9" rx="3"/>
    <rect x="458" y="332" width="22" height="30" rx="3"/>
    <!-- Beinchen -->
    <path d="M410 470 q-2 -12 10 -12 q10 0 8 12 z"/>
    <path d="M480 470 q-2 -12 10 -12 q10 0 8 12 z"/>
  </g>

  <!-- Titel-Tafel -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="300" y="530" font-size="66" font-style="italic" font-weight="700" fill="#f3c455" stroke="#5a3a12" stroke-width="1.2" paint-order="stroke">Everdell</text>
    <text x="300" y="572" font-size="30" font-weight="700" letter-spacing="14" fill="#eef3ff" font-family="'Trebuchet MS', Verdana, sans-serif">D U O</text>
  </g>
</svg>
